<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#7DD3C0"/>
  
  <!-- Main white square with glow -->
  <rect x="50" y="40" width="100" height="100" fill="white" filter="url(#glow)" rx="8"/>
  
  <!-- Inner A symbol -->
  <path d="M70 80 L100 50 L130 80 L120 90 L110 80 L90 80 L80 90 Z" fill="white" filter="url(#glow)"/>
</svg>
